name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unpack project
        run: unzip -o -q FacelessReelsMaker-project.zip -d project
      - name: Build APK
        working-directory: project
        run: gradle :app:assembleRelease --stacktrace
      - name: Rename APK
        run: cp project/app/build/outputs/apk/release/app-release.apk FacelessReelsMaker.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Faceless Reels Maker (build ${{ github.run_number }})
          files: FacelessReelsMaker.apk
